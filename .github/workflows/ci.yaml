name: 'CI'

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - 'upgrade/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and migrate on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    env:
      POSTGRES_VERSION: ${{ matrix.postgres }}
      BASELINE_IMAGE: ghcr.io/snytexx/jellyfin.pgsql@sha256:23551780f7799d386b197809192467af3885eb4cfad920a86cbfba9f4f7883ac

    steps:
      - name: Checkout repository and pinned server
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        run: |
          dotnet restore Jellyfin.Plugin.Pgsql.sln
          dotnet build Jellyfin.Plugin.Pgsql.sln -c Release --no-restore

      - name: Build Docker image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f docker/Dockerfile -t jellyfin-pgsql:ci .

      - name: Fresh 12.2 startup and preserved-data upgrade from production 12.0
        shell: bash
        run: |
          set -euo pipefail
          network=jellyfin-pgsql-ci
          config_volume=jellyfin-pgsql-upgrade-config
          base_url=http://127.0.0.1:18096
          api_token=ci-upgrade-fixture-token

          cleanup() {
            docker rm -f jellyfin-ci postgres-ci >/dev/null 2>&1 || true
            docker volume rm "$config_volume" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          diagnostics() {
            docker logs jellyfin-ci 2>&1 || true
            docker logs postgres-ci 2>&1 || true
          }
          trap cleanup EXIT
          trap diagnostics ERR

          sql() {
            docker exec -i postgres-ci psql -X -U jellyfin -d jellyfin -v ON_ERROR_STOP=1 "$@"
          }
          scalar() {
            sql -Atc "$1"
          }
          start_postgres() {
            docker run -d --name postgres-ci --network "$network" \
              -e POSTGRES_DB=jellyfin -e POSTGRES_USER=jellyfin \
              -e POSTGRES_PASSWORD=jellyfin "postgres:$POSTGRES_VERSION"
            for _ in $(seq 1 60); do
              if docker exec postgres-ci pg_isready -U jellyfin -d jellyfin >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          start_jellyfin() {
            local image="$1"
            shift
            docker run -d --name jellyfin-ci --network "$network" \
              -p 127.0.0.1:18096:8096 \
              -e POSTGRES_HOST=postgres-ci -e POSTGRES_PORT=5432 \
              -e POSTGRES_DB=jellyfin -e POSTGRES_USER=jellyfin \
              -e POSTGRES_PASSWORD=jellyfin "$@" "$image"
          }
          wait_for_startup() {
            local expected_version="$1"
            for _ in $(seq 1 120); do
              if [ "$(docker inspect -f '{{.State.Running}}' jellyfin-ci)" != true ]; then
                return 1
              fi
              if docker logs jellyfin-ci 2>&1 | grep -F 'Startup complete' >/dev/null && \
                  curl --fail --silent "$base_url/System/Info/Public" \
                    | jq -e --arg version "$expected_version" '.Version == $version' >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          assert_schema() {
            # These predicates distinguish the 12.2 model from the old full indexes.
            test "$(scalar "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'BaseItems' AND ((indexname = 'IX_BaseItems_OwnerId' AND indexdef LIKE '%WHERE (%\"OwnerId\" IS NOT NULL)%') OR (indexname = 'IX_BaseItems_ExtraType_OwnerId' AND indexdef LIKE '%WHERE (%\"ExtraType\" IS NOT NULL)%'));")" = 2
            test "$(scalar "SELECT COUNT(*) FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '20260827193306_Update_12_0-rc6';")" = 1
            test "$(scalar "SELECT COUNT(*) FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '20261002210711_Update_12_2';")" = 1
            test "$(scalar "SELECT min(id)::text || ',' || max(id)::text FROM (VALUES ('00000000-0000-0000-0000-000000000001'::uuid), ('00000000-0000-0000-0000-000000000002'::uuid)) AS sample(id);")" = '00000000-0000-0000-0000-000000000001,00000000-0000-0000-0000-000000000002'
          }

          docker network create "$network"
          start_postgres
          start_jellyfin jellyfin-pgsql:ci
          wait_for_startup 12.2.0
          assert_schema
          POSTGRES_CONTAINER=postgres-ci POSTGRES_USER=jellyfin \
            POSTGRES_DB=jellyfin POSTGRES_PASSWORD=jellyfin \
            bash scripts/test-postgresql-json-migration.sh
          docker stop --time 30 jellyfin-ci
          docker rm jellyfin-ci
          docker rm -f postgres-ci

          # Recreate an empty database for the actual production-baseline upgrade.
          start_postgres
          docker volume create "$config_volume"
          docker pull "$BASELINE_IMAGE"
          start_jellyfin "$BASELINE_IMAGE" -v "$config_volume:/config"
          wait_for_startup 12.0.0
          curl --fail --silent "$base_url/Startup/User" >/dev/null
          curl --fail --silent --request POST "$base_url/Startup/User" \
            -H 'Content-Type: application/json' \
            --data '{"Name":"upgrade-ci","Password":"ci-upgrade-test-password"}'
          curl --fail --silent --request POST "$base_url/Startup/Complete"
          test "$(scalar 'SELECT COUNT(*) FROM "Users";')" -gt 0
          test "$(scalar 'SELECT COUNT(*) FROM "BaseItems";')" -gt 0
          scalar 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId";' > /tmp/baseline-migrations.txt
          docker exec jellyfin-ci sh -c 'mkdir -p /config/plugins/configurations; printf "%s\n" "<UpgradeFixture>preserve-me</UpgradeFixture>" > /config/plugins/configurations/upgrade-fixture.xml'
          docker stop --time 30 jellyfin-ci
          docker rm jellyfin-ci

          # Real rows exercise preserved IDs, watch state, tags and intro segments.
          # Clone a root row to populate every required field in the baseline model.
          sql <<'SQL'
          INSERT INTO "BaseItems"
          SELECT (jsonb_populate_record(NULL::"BaseItems", to_jsonb(b) || jsonb_build_object(
              'Id', 'cd333333-3333-4333-8333-333333333333',
              'Type', 'MediaBrowser.Controller.Entities.Movies.Movie',
              'Name', 'CI preserved movie', 'SortName', 'ci preserved movie',
              'Data', '{}', 'Path', '/ci-media/preserved.mkv',
              'IsFolder', false, 'IsMovie', true, 'IsVirtualItem', false,
              'ParentId', NULL, 'TopParentId', NULL,
              'PresentationUniqueKey', 'ci-preserved-movie'))).*
          FROM "BaseItems" AS b LIMIT 1;
          INSERT INTO "UserData" ("ItemId", "UserId", "CustomDataKey", "PlaybackPositionTicks", "PlayCount", "IsFavorite", "Played", "LastPlayedDate")
          SELECT 'cd333333-3333-4333-8333-333333333333', "Id", 'ci-preserved-movie', 123456789, 7, true, true, '2026-01-01T00:00:00Z'
          FROM "Users" ORDER BY "Id" LIMIT 1;
          INSERT INTO "ItemValues" ("ItemValueId", "Type", "Value", "CleanValue")
          VALUES ('cd444444-4444-4444-8444-444444444444', 4, 'ci-hidden', 'ci-hidden');
          INSERT INTO "ItemValuesMap" ("ItemId", "ItemValueId")
          VALUES ('cd333333-3333-4333-8333-333333333333', 'cd444444-4444-4444-8444-444444444444');
          INSERT INTO "MediaSegments" ("Id", "ItemId", "Type", "StartTicks", "EndTicks", "SegmentProviderId")
          VALUES ('cd555555-5555-4555-8555-555555555555', 'cd333333-3333-4333-8333-333333333333', 1, 10000000, 90000000, 'ci-intro-provider');
          INSERT INTO "ApiKeys" ("DateCreated", "DateLastActivity", "Name", "AccessToken")
          VALUES (now(), now(), 'upgrade-ci', 'ci-upgrade-fixture-token');
          SQL
          scalar 'SELECT "Id", "Username", "Password", "NormalizedUsername" FROM "Users" ORDER BY "Id";' > /tmp/baseline-users.txt
          scalar "SELECT row_to_json(d)::text FROM \"UserData\" AS d WHERE \"ItemId\" = 'cd333333-3333-4333-8333-333333333333' ORDER BY \"UserId\", \"CustomDataKey\";" > /tmp/baseline-watchstate.txt
          scalar 'SELECT row_to_json(s)::text FROM "MediaSegments" AS s ORDER BY "Id";' > /tmp/baseline-segments.txt

          # The new image receives exactly the old database and config volume.
          start_jellyfin jellyfin-pgsql:ci -v "$config_volume:/config"
          wait_for_startup 12.2.0
          assert_schema
          scalar 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId";' > /tmp/upgraded-migrations.txt
          test -z "$(comm -23 /tmp/baseline-migrations.txt /tmp/upgraded-migrations.txt)"
          scalar 'SELECT "Id", "Username", "Password", "NormalizedUsername" FROM "Users" ORDER BY "Id";' > /tmp/upgraded-users.txt
          scalar "SELECT row_to_json(d)::text FROM \"UserData\" AS d WHERE \"ItemId\" = 'cd333333-3333-4333-8333-333333333333' ORDER BY \"UserId\", \"CustomDataKey\";" > /tmp/upgraded-watchstate.txt
          scalar 'SELECT row_to_json(s)::text FROM "MediaSegments" AS s ORDER BY "Id";' > /tmp/upgraded-segments.txt
          diff -u /tmp/baseline-users.txt /tmp/upgraded-users.txt
          diff -u /tmp/baseline-watchstate.txt /tmp/upgraded-watchstate.txt
          diff -u /tmp/baseline-segments.txt /tmp/upgraded-segments.txt
          test "$(docker exec jellyfin-ci cat /config/plugins/configurations/upgrade-fixture.xml)" = '<UpgradeFixture>preserve-me</UpgradeFixture>'

          # An authenticated query proves the preserved custom controller and tag
          # exclusion execute through Npgsql, rather than merely loading the DLL.
          curl --fail --silent --show-error --get "$base_url/Items/Filtered" \
            -H "Authorization: MediaBrowser Token=\"$api_token\"" --data-urlencode includeItemTypes=Movie \
            | jq -e '.TotalRecordCount == 1 and .Items[0].Name == "CI preserved movie" and .Items[0].Tags == ["ci-hidden"]'
          curl --fail --silent --show-error --get "$base_url/Items/Filtered" \
            -H "Authorization: MediaBrowser Token=\"$api_token\"" --data-urlencode includeItemTypes=Movie \
            --data-urlencode excludeTags=ci-hidden \
            | jq -e '.TotalRecordCount == 0 and (.Items | length) == 0'
