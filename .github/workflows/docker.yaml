name: '🐋 Build & Publish Docker Image'

on:
  push:
    branches:
      - master
      - 'upgrade/**'
    paths-ignore:
      - '**/*.md'
  release:
    types:
      - released
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository and pinned server
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine image tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^FROM jellyfin\/jellyfin:\([^[:space:]]*\).*$/\1/p' docker/Dockerfile)"
          test -n "$version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_tag="$image:$version-sha-${GITHUB_SHA:0:12}"

          # Candidate branches and release tags get only the source commit tag.
          # Only a build of master may move the production aliases.
          {
            echo 'tags<<IMAGE_TAGS'
            echo "$commit_tag"
            if [ "$GITHUB_REF" = 'refs/heads/master' ]; then
              echo "$image:$version"
              echo "$image:latest"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
